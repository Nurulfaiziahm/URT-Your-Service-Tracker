<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Service Tracker - Login</title>
    <link rel="stylesheet" href="../owner/css/owner-auth.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="login-page">
    <!-- Owner Login Centered Card -->
    <main class="login-card">
      <img src="../image/logo-urt.svg" alt="URT Logo" class="login-brand-img" />
      <div class="login-brand-tagline">YOUR SERVICE TRACKER</div>
      <h1 class="login-title">Login</h1>
      <p class="login-subtitle">
        Masuk untuk mengelola tiket dan proses servis pelanggan.
      </p>

      <form id="ownerLoginForm" class="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email</label>
          <div class="input-container">
            <input
              type="email"
              id="loginEmail"
              class="form-control no-icon"
              placeholder="nama@usaha.com"
              value="andi@serviskita.com"
              required
            />
          </div>
          <div class="field-error" id="loginEmailError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-container">
            <input
              type="password"
              id="loginPassword"
              class="form-control no-icon"
              placeholder="••••••••"
              value="password123"
              required
            />
            <button
              type="button"
              class="toggle-password"
              data-target="loginPassword"
              aria-label="Lihat password"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <div class="field-error" id="loginPasswordError"></div>
        </div>

        <button type="submit" class="btn-primary">Masuk ke Portal Owner</button>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px;">
          <a href="javascript:void(0)" onclick="alert('Untuk mereset password akun demo Andi Ramadhan, silakan gunakan kredensial demo default: andi@serviskita.com / password123')" class="forgot-password-link">Lupa Password?</a>
          <a href="register.html" style="color: #2563eb; text-decoration: none; font-weight: 500;">Daftar Tempat Servis</a>
        </div>

        <div class="info-banner" style="margin-top: 20px;">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-4" />
            <path d="M12 8h.01" />
          </svg>
          <span>Akun Demo: <strong>andi@serviskita.com</strong> (Owner ServisKita).</span>
        </div>

        <div style="text-align: center; margin-top: 20px; font-size: 13px;">
          <a href="../masuk.html" style="color: #64748b; text-decoration: none;">&larr; Kembali ke Pilihan Portal</a>
        </div>
      </form>
    </main>

    <script src="../owner/js/owner-auth.js"></script>
  </body>
</html>
