<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrasi Akun Pelanggan — URT Your Service Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="owner/css/owner-auth.css" />
    <style>
      .register-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--background);
        padding: 40px 16px;
      }
      .reg-card {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        width: 100%;
        max-width: 480px;
        padding: 40px 36px;
      }
      .reg-brand-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .reg-brand-logo {
        height: 38px;
        margin-bottom: 12px;
      }
      .reg-role-badge {
        display: inline-block;
        background: #ecfdf5;
        color: #059669;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 8px;
      }
      .reg-title {
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 6px;
      }
      .reg-subtitle {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .reg-form {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .reg-link-row {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: var(--text-muted);
      }
      .reg-link-row a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }
      .reg-link-row a:hover {
        text-decoration: underline;
      }
      .back-home-link {
        display: inline-block;
        margin-top: 16px;
        font-size: 13px;
        color: var(--text-muted);
        text-decoration: none;
        text-align: center;
        width: 100%;
      }
      .back-home-link:hover {
        color: var(--text);
      }
      .toast-success {
        display: none;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #065f46;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        margin-bottom: 16px;
        align-items: center;
        gap: 10px;
      }
      @media (max-width: 480px) {
        .register-wrap {
          padding: 20px 12px;
        }
        .reg-card {
          padding: 28px 18px;
        }
        .reg-title {
          font-size: 20px;
        }
        .btn-primary {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <div class="register-wrap">
      <main class="reg-card">
        <div class="reg-brand-header">
          <a href="index.html">
            <img src="image/logo-urt.svg" alt="URT Logo" class="reg-brand-logo" />
          </a>
          <div><span class="reg-role-badge">AKUN PELANGGAN</span></div>
          <h1 class="reg-title">Buat Akun Pelanggan</h1>
          <p class="reg-subtitle">
            Daftar untuk memantau status servis, menyetujui estimasi biaya, dan melihat riwayat perbaikan Anda.
          </p>
        </div>

        <div id="toastSuccess" class="toast-success" role="alert">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
          <div>
            <strong>Registrasi berhasil!</strong> Mengalihkan ke portal pelanggan...
          </div>
        </div>

        <form id="customerRegisterForm" class="reg-form" action="pelanggan/beranda-pelanggan.html" method="get" novalidate>
          <div class="form-group">
            <label class="form-label" for="regName">Nama Lengkap</label>
            <div class="input-container">
              <input
                type="text"
                id="regName"
                name="name"
                class="form-control no-icon"
                placeholder="Contoh: Nino Rachimas"
                required
              />
            </div>
            <div class="field-error" id="regNameError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regEmail">Alamat Email</label>
            <div class="input-container">
              <input
                type="email"
                id="regEmail"
                name="email"
                class="form-control no-icon"
                placeholder="nino.rachimas@email.com"
                required
              />
            </div>
            <div class="field-error" id="regEmailError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPhone">Nomor WhatsApp / HP</label>
            <div class="input-container">
              <input
                type="tel"
                id="regPhone"
                name="phone"
                class="form-control no-icon"
                placeholder="0812 3456 7890"
                required
              />
            </div>
            <div class="field-error" id="regPhoneError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPassword">Kata Sandi</label>
            <div class="input-container">
              <input
                type="password"
                id="regPassword"
                name="password"
                class="form-control no-icon"
                placeholder="Minimal 6 karakter"
                required
              />
              <button
                type="button"
                class="toggle-password"
                data-target="regPassword"
                aria-label="Lihat password"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <div class="field-error" id="regPasswordError"></div>
          </div>

          <button type="submit" class="btn-primary" style="margin-top: 8px;">
            Daftar Sekarang
          </button>
        </form>

        <div class="reg-link-row">
          Sudah punya akun? <a href="masuk.html">Masuk ke Portal</a>
        </div>

        <a href="index.html" class="back-home-link">
          &larr; Kembali ke Beranda URT
        </a>
      </main>
    </div>

    <script>
      // Toggle password visibility
      document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (input) {
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
          }
        });
      });

      // Form validation & submission
      const form = document.getElementById('customerRegisterForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        let isValid = true;
        
        // Reset errors
        ['regName', 'regEmail', 'regPhone', 'regPassword'].forEach(id => {
          const errEl = document.getElementById(id + 'Error');
          if (errEl) errEl.textContent = '';
          const inp = document.getElementById(id);
          if (inp) inp.classList.remove('is-invalid');
        });

        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!name) {
          document.getElementById('regNameError').textContent = 'Nama lengkap wajib diisi.';
          document.getElementById('regName').classList.add('is-invalid');
          isValid = false;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email) {
          document.getElementById('regEmailError').textContent = 'Email wajib diisi.';
          document.getElementById('regEmail').classList.add('is-invalid');
          isValid = false;
        } else if (!emailRegex.test(email)) {
          document.getElementById('regEmailError').textContent = 'Format email tidak valid.';
          document.getElementById('regEmail').classList.add('is-invalid');
          isValid = false;
        }

        if (!phone) {
          document.getElementById('regPhoneError').textContent = 'Nomor WhatsApp wajib diisi.';
          document.getElementById('regPhone').classList.add('is-invalid');
          isValid = false;
        } else if (phone.replace(/\D/g, '').length < 9) {
          document.getElementById('regPhoneError').textContent = 'Nomor WhatsApp minimal 9 digit.';
          document.getElementById('regPhone').classList.add('is-invalid');
          isValid = false;
        }

        if (!password) {
          document.getElementById('regPasswordError').textContent = 'Kata sandi wajib diisi.';
          document.getElementById('regPassword').classList.add('is-invalid');
          isValid = false;
        } else if (password.length < 6) {
          document.getElementById('regPasswordError').textContent = 'Kata sandi minimal 6 karakter.';
          document.getElementById('regPassword').classList.add('is-invalid');
          isValid = false;
        }

        if (isValid) {
          const toast = document.getElementById('toastSuccess');
          toast.style.display = 'flex';
          setTimeout(() => {
            window.location.href = 'pelanggan/beranda-pelanggan.html';
          }, 800);
        }
      });
    </script>
  </body>
</html>
