<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrasi - URT Device Tracker</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="page-portal page-register">
    <header>
      <a href="index.html">
        <img src="image/logo-urt.svg" alt="URT — Your Service Tracker" height="40">
      </a>
      <hr>
      <nav>
        <a href="index.html">Kembali ke Beranda</a>
        <a href="masuk.html">Sudah punya akun? Login</a>
      </nav>
    </header>

    <main>
      <section id="register">
        <h2>Buat Akun Baru</h2>
        <form action="pendaftaran-servis.html">
          <p>
            <label
              >Daftar sebagai:
              <select id="registerRole">
                <option value="pelanggan">Pelanggan</option>
                <option value="teknisi">Teknisi</option>
                <option value="owner">Owner</option>
              </select>
            </label>
          </p>
          <p>
            <label>Nama lengkap: <input type="text" required></label>
          </p>
          <p>
            <label>Email: <input type="email" required></label>
          </p>
          <p>
            <label>No. WhatsApp: <input type="tel" required></label>
          </p>
          <p>
            <label>Password: <input type="password" required></label>
          </p>
          <p>
            <button type="submit">Pendaftaran Perangkat</button>
          </p>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
