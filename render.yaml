services:
  - type: web
    name: urt-api
    runtime: node
    plan: free
    rootDir: urt/api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ID
        value: urt
      - key: TRUST_PROXY
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: REDIS_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ACCESS_KEYS
        sync: false
      - key: REFRESH_KEYS
        sync: false
      - key: SESSION_KEYS
        sync: false
      - key: MAIL_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: urt-web
    runtime: static
    rootDir: urt/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
