<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — URT Your Device Tracker</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="page-portal page-login">
    <header>
      <a href="index.html">
        <img src="image/logo-urt.svg" alt="URT — Your Service Tracker" height="40">
      </a>
      <nav aria-label="Navigasi halaman">
        <a href="index.html">Kembali ke Beranda</a>
        <a href="registrasi.html">Belum Memiliki Akun? Registrasi</a>
      </nav>
    </header>

    <main>
      <section aria-labelledby="judul-masuk">
        <h2 id="judul-masuk">Masuk ke Portal</h2>
        <form>
          <p>
            <label for="email">Email</label><br>
            <input
              name="email"
              id="email"
              type="email"
              placeholder="email@contoh.com"
              required>
          </p>

          <p>
            <label for="password">Password</label><br>
            <input name="password" id="password" type="password" required>
          </p>

          <fieldset>
            <legend>Pilih Portal</legend>
            <button type="submit" formaction="pelanggan/beranda-pelanggan.html">
              Masuk sebagai Pelanggan
            </button>
            <button type="submit" formaction="teknisi/beranda-teknisi.html">
              Masuk sebagai Teknisi
            </button>
            <button type="submit" formaction="owner/beranda-owner.html">
              Masuk sebagai Owner
            </button>
          </fieldset>
        </form>

        <p><a href="index.html">Batal</a></p>
      </section>
    </main>

    <footer>
      <p>URT — Your Device Tracker | Kelompok 2 UT</p>
    </footer>
  </body>
</html>
