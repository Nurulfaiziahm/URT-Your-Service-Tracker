name: Deploy API to VPS

on:
     push:
          branches:
               - main
          paths:
               - "urt/api/**"
               - ".github/workflows/deploy.yml"
     workflow_dispatch:

# Never run two deploys at the same time on the VPS
concurrency:
     group: deploy-api
     cancel-in-progress: false

jobs:
     deploy:
          # Runs directly on the VPS via the self-hosted GitHub Actions runner
          runs-on: [self-hosted, linux]
          timeout-minutes: 30

          env:
               REPO_DIR: /var/www/URT-Your-Service-Tracker
               APP_DIR: /var/www/URT-Your-Service-Tracker/urt/api

          steps:
               - name: Pull latest code
                 working-directory: ${{ env.REPO_DIR }}
                 run: |
                      set -e
                      git fetch origin main
                      git reset --hard origin/main

               - name: Build and restart API (.env is already in the directory)
                 working-directory: ${{ env.APP_DIR }}
                 run: |
                      set -e
                      # Build first: if the build fails, the old containers keep running
                      docker compose build
                      # Recreate containers with the new image (only swaps once build succeeded)
                      docker compose up -d --remove-orphans

               - name: Cleanup old Docker images
                 if: always()
                 run: |
                      docker image prune -f
                      docker builder prune -f
